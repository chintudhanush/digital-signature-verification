<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Signature Generator</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
    font-family: Arial, Helvetica, sans-serif;
    color:white;
}

.card{
    background: rgba(255,255,255,0.12);
    padding:40px;
    border-radius:20px;
    backdrop-filter: blur(12px);
    text-align:center;
    box-shadow: 0 0 30px rgba(0,255,255,0.3);
}

h2{
    margin-bottom:20px;
}

input[type=file]{
    padding:10px;
    background:white;
    border-radius:10px;
}

button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:25px;
    background: linear-gradient(45deg,#00f2fe,#4facfe);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.08);
    box-shadow:0 0 20px cyan;
}

.verify-btn{
    background: linear-gradient(45deg,#ff9966,#ff5e62);
    margin-top:15px;
}
</style>
</head>

<body>
<div class="card">
    <h2>🔐 Digital Signature Generator</h2>

    <form action="/sign" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required><br>
        <button type="submit">Generate Signature</button>
    </form>

    <!-- Go to Verification Button -->
    <form action="/verify" method="get">
        <button type="submit" class="verify-btn">Go to Verification</button>
    </form>

</div>
</body>
</html>
