<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signature Generated</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#141E30,#243B55);
    font-family: Arial, Helvetica, sans-serif;
    color:white;
}

.card{
    background: rgba(255,255,255,0.15);
    padding:45px;
    border-radius:25px;
    backdrop-filter: blur(12px);
    text-align:center;
    box-shadow:0 0 40px rgba(0,255,255,0.6);
    animation: fade 1s ease;
    width:420px;
}

@keyframes fade{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

h2{
    margin-bottom:20px;
}

.info{
    margin:10px 0;
    font-size:15px;
}

.buttons{
    margin-top:30px;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.verify-btn{
    background: linear-gradient(45deg,#00ffcc,#00b3ff);
}

.verify-btn:hover{
    transform: scale(1.1);
    box-shadow:0 0 20px cyan;
}

.home-btn{
    background: linear-gradient(45deg,#ff9a9e,#fad0c4);
}

.home-btn:hover{
    transform: scale(1.1);
    box-shadow:0 0 20px pink;
}
</style>
</head>

<body>

<div class="card">
    <h2>✅ Signature Generated</h2>

    <p class="info"><b>File:</b> {{ filename }}</p>
    <p class="info"><b>Signature File:</b> {{ sigfile }}</p>

    <div class="buttons">
        <!-- GO TO VERIFICATION PAGE -->
        <form action="/verify" method="get" style="display:inline;">
            <button class="verify-btn" type="submit">Go to Verification</button>
        </form>
        

        <!-- BACK TO HOME -->
        <form action="/home" method="get" style="display:inline;">
            <button class="home-btn" type="submit">Back to Home</button>
        </form>
    </div>
</div>

</body>
</html>
